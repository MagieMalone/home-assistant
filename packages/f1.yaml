automation:
  - alias: "f1-announce"
    id: "4814210d-7c2b-481f-85e4-8c5278e30a5a"

    triggers:
      - trigger: time
        at:
          - entity_id: sensor.f1_next_fp1
            offset: "-00:10:00"
          - entity_id: sensor.f1_next_fp2
            offset: "-00:10:00"
          - entity_id: sensor.f1_next_fp3
            offset: "-00:10:00"
          - entity_id: sensor.f1_next_qualifying
            offset: "-00:10:00"
          - entity_id: sensor.f1_next_race_time
            offset: "-00:10:00"
          - entity_id: sensor.f1_next_sprint
            offset: "-00:10:00"
          - entity_id: sensor.f1_next_sq
            offset: "-00:10:00"
    condition:
      - condition: state
        entity_id: input_boolean.f1_announcements
        state: "on"
      - condition: or
        conditions:
          - condition: state
            entity_id: input_select.arnoud_status
            state: "Thuis"
          - condition: state
            entity_id: input_select.arnoud_status
            state: "Net Thuis"
      - condition: state
        entity_id:
          - schedule.f1_announce
        state: "on"
    action:
#      - action: notify.pushover
#        data:
#          message: >
#            {% set next_race = state_attr('sensor.f1_next_race', 'race_name') %}
#            {% set mapentity = {'sensor.f1_next_fp1':'Eerste vrij training','sensor.f1_next_fp2':'Tweede vrije training','sensor.f1_next_fp3':'Derde vrije training','sensor.f1_next_qualifying':'Kwalificatie', 'sensor.f1_next_race':'Race','sensor.f1_next_sprint':'Sprint race', 'sensor.f1_next_sq':'Sprint kwalificatie'} %}
#            {% set name = mapentity.get(trigger.entity_id, 'unknown') %} 
#            de {{name}} van de {{next_race}} begint over 10 minuten 
#          title: f1 testing
      - alias: "Send TTS using Google Home Resume script"
        action: script.turn_on
        target:
          entity_id: script.google_home_resume
        data:
          variables:
            action:
              - action: tts.speak
                target:
                  entity_id: tts.home_assistant_cloud
                data:
                  cache: false
                  media_player_entity_id: media_player.speakers
                  message: >
                    {% set next_race = state_attr('sensor.f1_next_race', 'race_name') %}
                    {% set mapentity = {'sensor.f1_next_fp1':'Eerste vrij training','sensor.f1_next_fp2':'Tweede vrije training','sensor.f1_next_fp3':'Derde vrije training','sensor.f1_next_qualifying':'Kwalificatie', 'sensor.f1_next_race':'Race','sensor.f1_next_sprint':'Sprint race', 'sensor.f1_next_sq':'Sprint kwalificatie'} %}
                    {% set name = mapentity.get(trigger.entity_id, 'unknown') %} 
                    de {{name}} van de {{next_race}} begint over 10 minuten 
                  language: nl-NL
      - alias: "Wait until the target is idle or off before applying the volume for the TTS message"
        wait_template: "{{ states('media_player.speakers') in ['idle', 'off'] }}"
      - alias: "Apply TTS volume"
        action: media_player.volume_set
        target:
          entity_id: media_player.speakers
        data:
          volume_level: "{{states('input_number.tts_volume')| float}}"
      - action: switch.turn_on
        target:
          entity_id: switch.media_group
  - alias: f1_lights_save
    id: "019f0d0c-0f45-762d-8d0e-de7d8c0de4ad"
    trigger:
      - trigger: state
        entity_id: sensor.f1_session_status
        to:
          - "pre"
        not_from:
          - "unavailable"
    actions:
      - action: scene.create
        data:
          scene_id: before_f1lights
          snapshot_entities:
            - light.hue_lightstrip_plus_1
  - alias: f1_lights_restore
    id: "019f0d0f-9f2f-76aa-aeed-39a6763eabe9"
    trigger:
      - trigger: state
        entity_id: sensor.f1_session_status
        to:
          - "ended"
        not_from:
          - "unavailable"
    actions:
      - action: scene.turn_on
        target:
          entity_id: scene.before_f1lights
  - alias: f1_lights
    id: "440dee78-1a97-429e-8311-0cadb276dc85"
    triggers:
      - trigger: state
        entity_id: sensor.f1_track_status
        not_from:
          - "unavailable"
    conditions:
      - or:
        - condition: state
          entity_id: input_select.arnoud_status
          state: "Thuis"
        - condition: state
          entity_id: input_select.arnoud_status
          state: "Net Thuis"
        - condition: state
          entity_id: input_boolean.guests_boolean
          state: "on"
    actions:
      - choose:
        # CLEAR, YELLOW, VSC, VSC_ENDING, SC, RED
          - conditions:
            - condition: state
              entity_id: sensor.f1_track_status
              state: "CLEAR"
            sequence:
              - action: light.turn_on
                target: 
                  entity_id: light.hue_lightstrip_plus_1
                data:
                  color_name: "green"
          - conditions:
            - condition: state
              entity_id: sensor.f1_track_status
              state: "YELLOW"
            sequence:
              - action: light.turn_on
                target: 
                  entity_id: light.hue_lightstrip_plus_1
                data:
                  color_name: "yellow"
          - conditions:
            - condition: state
              entity_id: sensor.f1_track_status
              state: "VSC"
            sequence:
              - action: light.turn_on
                target: 
                  entity_id: light.hue_lightstrip_plus_1
                data:
                  color_name: "orange"
          - conditions:
            - condition: state
              entity_id: sensor.f1_track_status
              state: "VSC_ENDING"
            sequence:
              - action: light.turn_on
                target: 
                  entity_id: light.hue_lightstrip_plus_1
                data:
                  color_name: "orange"
                  flash: short
          - conditions:
            - condition: state
              entity_id: sensor.f1_track_status
              state: "SC"
            sequence:
              - action: light.turn_on
                target: 
                  entity_id: light.hue_lightstrip_plus_1
                data:
                  color_name: "darkorange"
                  flash: long
          - conditions:
            - condition: state
              entity_id: sensor.f1_track_status
              state: "RED"
            sequence:
              - action: light.turn_on
                target: 
                  entity_id: light.hue_lightstrip_plus_1
                data:
                  color_name: "red"

