automation:
  - alias: "Lights on normal"
    id: "1528911899317"
    trigger:
      - trigger: numeric_state
        entity_id: sun.sun
        attribute: elevation
        below: 3.5
    condition:
      condition: and
      conditions:
        - condition: state
          entity_id: light.woonkamer
          state: "off"
        - or:
            - "{{ not is_state('input_select.house_mode', 'weg') }}"
            - condition: state
              entity_id: input_boolean.vakantie_mode
              state: "on"
        - condition: state
          entity_id:
            - schedule.lights
          state: "on"
    action:
      - action: script.woonkamer_lights_fadein

  - alias: "Lights on bad weather"
    id: "5312689562015890236985290"
    trigger:
      - trigger: numeric_state
        entity_id: sun.sun
        value_template: "{{ state.attributes.elevation }}"
        below: 7
    condition:
      condition: and
      conditions:
        - condition: state
          entity_id: light.woonkamer
          state: "off"
        - or:
            - "{{ not is_state('input_select.house_mode', 'weg') }}"
            - condition: state
              entity_id: input_boolean.vakantie_mode
              state: "on"
        # measurement newer then 30 minutes
        #- "{{as_timestamp(states.sensor.berkhout_condition.last_updated)+1800 > as_timestamp(now())}}"
        # sky not clear
        - "{{ not is_state('sensor.berkhout_condition', 'clear') }}"
    action:
      - action: script.woonkamer_lights_fadein

  - alias: "Lights on thuiskomst"
    id: "5480797213460891"
    trigger:
      - trigger: state
        entity_id: input_select.arnoud_status
        to: "Net Thuis"
      - trigger: state
        entity_id: input_select.arnoud_status
        to: "Thuis"
    condition:
      condition: or
      conditions:
        - condition: and
          conditions:
            - condition: numeric_state
              entity_id: sun.sun
              value_template: "{{ state.attributes.elevation }}"
              below: 3.5
            - condition: state
              entity_id: light.woonkamer
              state: "off"
        - condition: and
          conditions:
            - condition: state
              entity_id: light.woonkamer
              state: "off"
            - condition: numeric_state
              entity_id: sun.sun
              value_template: "{{ state.attributes.elevation }}"
              below: 7
            # measurement newer then 30 minutes
            - "{{as_timestamp(strptime(state_attr('sensor.berkhout_condition', 'Measured'),'%a %b %d %H:%M:%S %Y'))+1800 > as_timestamp(now())}}"
            # sky not clear
            - "{{ not is_state('sensor.berkhout_condition', 'clear') }}"
            - condition: state
              entity_id: input_select.house_mode
              state: "weg"
    action:
      - action: script.woonkamer_lights

script:
  woonkamer_lights_fadein:
    sequence:
      - alias: "turn off brightness automation"
        action: automation.turn_off
        target:
          entity_id: automation.update_brightness_based_on_house_status
      - alias: staande lamp
        action: light.turn_on
        target:
          entity_id: light.staande_lamp
        data:
          brightness_pct: 1
          color_temp_kelvin: 3000
      - alias: strip
        action: light.turn_on
        target:
          entity_id: light.hue_lightstrip_plus_1
        data:
          xy_color:
            - 0.3388
            - 0.1332
          brightness_pct: 1
      - alias: pendant_up
        action: light.turn_on
        target:
          entity_id: light.hue_color_pendant_up_1
        data:
          xy_color:
            - 0.324
            - 0.154
          brightness_pct: 1
      - alias: pendant_down
        action: light.turn_on
        target:
          entity_id: light.hue_color_pendant_down_1
        data:
          color_temp_kelvin: 2202
          brightness_pct: 1
      - alias: staande lamp
        action: light.turn_on
        target:
          entity_id: light.staande_lamp
        data:
          transition: 300
          brightness_pct: 50
          color_temp_kelvin: 3000
      - alias: strip
        action: light.turn_on
        target:
          entity_id: light.hue_lightstrip_plus_1
        data:
          transition: 300
          xy_color:
            - 0.3388
            - 0.1332
          brightness_pct: 30
      - alias: pendant_up
        action: light.turn_on
        target:
          entity_id: light.hue_color_pendant_up_1
        data:
          xy_color:
            - 0.324
            - 0.154
          brightness_pct: 50
          transition: 300
      - alias: pendant_down
        action: light.turn_on
        target:
          entity_id: light.hue_color_pendant_down_1
        data:
          color_temp_kelvin: 3000
          brightness_pct: 50
          transition: 300
      - delay:
          seconds: 5
      - alias: "turn on brightness automation"
        action: automation.turn_on
        target:
          entity_id: automation.update_brightness_based_on_house_status
  woonkamer_lights:
    sequence:
      - alias: staande lamp
        action: light.turn_on
        target:
          entity_id: light.staande_lamp
        data:
          transition: 2
          brightness_pct: 50
          color_temp_kelvin: 3000
      - alias: strip
        action: light.turn_on
        target:
          entity_id: light.hue_lightstrip_plus_1
        data:
          transition: 2
          xy_color:
            - 0.3388
            - 0.1332
          brightness_pct: 30
      - alias: pendant_up
        action: light.turn_on
        target:
          entity_id: light.hue_color_pendant_up_1
        data:
          xy_color:
            - 0.324
            - 0.154
          brightness_pct: 50
          transition: 300
      - alias: pendant_down
        action: light.turn_on
        target:
          entity_id: light.hue_color_pendant_down_1
        data:
          color_temp_kelvin: 3000
          brightness_pct: 50
          transition: 30
  woonkamer_lights_fadein_smooth:
    sequence:
      - alias: staande lamp
        action: light.turn_on
        target:
          entity_id: light.staande_lamp
        data:
          brightness_pct: 1
          color_temp_kelvin: 3000
      - alias: strip
        action: light.turn_on
        target:
          entity_id: light.hue_lightstrip_plus_1
        data:
          xy_color:
            - 0.3388
            - 0.1332
          brightness_pct: 1
      - alias: pendant_up
        action: light.turn_on
        target:
          entity_id: light.hue_color_pendant_up_1
        data:
          xy_color:
            - 0.324
            - 0.154
          brightness_pct: 1
      - alias: pendant_down
        action: light.turn_on
        target:
          entity_id: light.hue_color_pendant_down_1
        data:
          color_temp_kelvin: 3000
          brightness_pct: 1
      - alias: staande lamp
        action: python_script.smooth_fader
        data:
          entity_id: light.staande_lamp
          duration: "00:05:00"
          brightness_end: 128
      - alias: strip
        action: python_script.smooth_fader
        data:
          entity_id: light.hue_lightstrip_plus_1
          duration: "00:05:00"
          brightness_end: 85
      - alias: pendant_up
        action: python_script.smooth_fader
        data:
          entity_id: light.hue_color_pendant_up_1
          duration: "00:05:00"
          brightness_end: 128
      - alias: pendant_down
        action: python_script.smooth_fader
        data:
          entity_id: light.hue_color_pendant_down_1
          duration: "00:05:00"
          brightness_end: 128
